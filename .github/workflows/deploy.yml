# The only workflow that runs on the self-hosted runner. It must never be triggered by
# pull_request or pull_request_target, and no other workflow may use the dice-deploy label.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Only a successful CI run of a push to main in this repository; a fork PR from a branch named main does not count.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: [self-hosted, dice-deploy]
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
          sparse-checkout: docker-compose.yml
          sparse-checkout-cone-mode: false
      - name: Pull the image and start the containers
        env:
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
          IMAGE: ghcr.io/${{ github.repository }}:sha-${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [[ -z "$DEPLOY_DIR" || ! -f "$DEPLOY_DIR/.env" ]]; then
            echo "::error::Set the variable DEPLOY_DIR in the production environment to a directory that holds the .env file."
            exit 1
          fi
          cp docker-compose.yml "$DEPLOY_DIR/docker-compose.yml"
          cd "$DEPLOY_DIR"
          # Compose reads this file automatically, so a manual `docker compose up -d` here keeps the tested
          # image. Written by this workflow only; the operator's .env is never touched.
          printf 'services:\n  app:\n    image: %s\n' "$IMAGE" > docker-compose.override.yml
          docker compose pull
          docker compose up -d --no-build --remove-orphans
      - name: Wait for /healthz
        env:
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"
          url="http://$(docker compose port app 3000)/healthz"
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null "$url"; then
              echo "Healthy: $url"
              exit 0
            fi
            sleep 2
          done
          # Only the container state; app logs may contain personal data and this repository's logs are public.
          docker compose ps
          echo "::error::$url did not report healthy within 120 seconds."
          exit 1
