<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="color-scheme" content="light dark" />
    <title>Würfel</title>
    <!-- Link preview (spec 10.2): the same for every page, no room data. The server replaces __BASE_URL__
         with the origin of BASE_URL when it sends this file. vite-ignore: Vite must not resolve it. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Würfel" />
    <meta property="og:description" content="Gemeinsam würfeln, wer welches Geschenk bekommt. Anmelden mit Discord." />
    <meta property="og:image" content="__BASE_URL__/og.png" vite-ignore />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Zwei Würfel, einer zeigt eine Sechs" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Classic, parser-blocking script: sets data-theme before the first paint (inline scripts are blocked by the CSP). -->
    <script src="/theme-init.js" vite-ignore></script>
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="./main.tsx"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
