# Example reverse proxy for dice. The app listens on 127.0.0.1:3000 (see docker-compose.yml).
# Add TLS (certificate paths, port 80 redirect) the way your server already does it.

# nginx answers some requests itself: malformed URLs (400), too large bodies (413), and 502 while the app
# restarts. Those answers get the app's headers here, but only where the app sent none: an empty value
# makes add_header skip the header, so the app's own headers are never doubled or overridden.
map $upstream_http_x_robots_tag $dice_robots { "" "noindex, nofollow, noarchive, nosnippet, noimageindex"; default ""; }
map $upstream_http_content_security_policy $dice_csp { "" "default-src 'none'; frame-ancestors 'none'"; default ""; }
map $upstream_http_x_content_type_options $dice_nosniff { "" "nosniff"; default ""; }
map $upstream_http_referrer_policy $dice_referrer { "" "same-origin"; default ""; }

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dice.example.org;

    # ssl_certificate     /etc/letsencrypt/live/dice.example.org/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/dice.example.org/privkey.pem;

    # Avatars are at most 1 MB; nothing else uploads data.
    client_max_body_size 2m;

    # See the maps above. Server level only: an add_header inside a location would drop these there.
    add_header X-Robots-Tag            $dice_robots always;
    add_header Content-Security-Policy $dice_csp always;
    add_header X-Content-Type-Options  $dice_nosniff always;
    add_header Referrer-Policy         $dice_referrer always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSockets live under /ws/ only. The app pings every 25 s, so 3600 s is only a safety net.
    location /ws/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
