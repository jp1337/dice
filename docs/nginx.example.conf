# Example reverse proxy for dice. The app listens on 127.0.0.1:3000 (see docker-compose.yml).
# Add TLS (certificate paths, port 80 redirect) the way your server already does it.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dice.example.org;

    # ssl_certificate     /etc/letsencrypt/live/dice.example.org/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/dice.example.org/privkey.pem;

    # Avatars are at most 1 MB; nothing else uploads data.
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSockets live under /ws/ only. The app pings every 25 s, so 3600 s is only a safety net.
    location /ws/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
